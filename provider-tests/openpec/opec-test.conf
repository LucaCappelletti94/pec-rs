# Settings for one test provider, appended to the opec.conf OpenPEC ships, whose later assignments win.
# Every address and name here is fictitious and the domain is reserved for tests (RFC 2606).

$providerName     = 'Gestore PEC di Prova';
$adminName        = 'Gestore PEC di Prova';
$localCertDomains = ['pec.test'];

# Postfix hands every message to OpenPEC on 10024 and takes the results back on 10025, and certified mail for the
# local domain is delivered to Dovecot over LMTP.
%receiveTCP        = (10024, 'SMTP');
$forward_canonical = 'SMTP:127.0.0.1:10025';
$forward_pec       = '127.0.0.1:24';

# The tests send no virus, see None.pm.
$av        = 'None';
$av_params = [];

$openSSLPath    = '/usr/bin/openssl';
$engine         = 'openssl';
$filePrivateKey = 'key.pem';
$certFile       = 'cert.pem';
$CApath         = '/home/dopec/MYHOME/certs/';
$add_certs      = [];

# The provider index is a local slapd holding this provider's own entry, read with an anonymous bind.
$ldap_host  = '127.0.0.1';
$ldap_port  = 389;
$ldap_user  = undef;
$ldap_psw   = undef;
$ldap2_host = undef;

$SYSTEM_DO_LOG        = 0;
$SYSTEM_LOGFILE_LEVEL = 5;

# An empty TSA host leaves log timestamping off, which receipts do not depend on.
$tsa_host = '';
$LEGAL_DO_LOG         = 0;

1;
