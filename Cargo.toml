[package]
name = "postacert"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Parsing PEC messages, Italian certified email, and reading and writing their daticert.xml certification data"
readme = "README.md"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/postacert"
documentation = "https://docs.rs/postacert"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
keywords = ["pec", "certified-email", "italy", "email", "daticert"]
categories = ["email", "parser-implementations"]
include = [
    "/src",
    "/tests/*.rs",
    "/tests/fixtures/daticert",
    "/tests/fixtures/messages",
    "/tests/fixtures/original",
    "/tests/fixtures/pki/anchors",
    "/tests/fixtures/pki/provider.der",
    "/tests/fixtures/pki/provider.key.der",
    "/tests/fixtures/pki/signers",
    "/README.md",
    "/LICENSE",
]

[dependencies]
cms = { version = "=0.3.0-rc.2", default-features = false }
# Aruba and InfoCert send their SignedData in BER with indefinite lengths.
der = { version = "0.8.3", default-features = false, features = ["ber"] }
jiff = { version = "0.2.39", default-features = false, features = ["alloc"] }
mail-parser = "1.0.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }
rustls-pki-types = { version = "1.16.0", default-features = false, features = ["alloc"] }
# Without ring, which fails to build for wasm32-unknown-unknown.
rustls-webpki = { version = "0.103.17", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false, features = ["oid"] }
thiserror = "2.0.21"

[dev-dependencies]
base64ct = { version = "1.8.0", features = ["alloc"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"
multiple_crate_versions = "allow"
# Contradicts the unreachable_pub lint enabled above, which asks for pub(crate) where this asks for pub.
redundant_pub_crate = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_used = "warn"

[package.metadata.docs.rs]
all-features = true

[profile.mutants]
inherits = "test"
debug = "none"
