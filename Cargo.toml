[package]
name = "pec"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Reading PEC messages, Italian certified email"
readme = "README.md"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/pec-rs"
documentation = "https://docs.rs/pec"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
keywords = ["pec", "certified-email", "italy", "email", "daticert"]
categories = ["email", "parser-implementations"]

[dependencies]
jiff = { version = "0.2.39", default-features = false, features = ["alloc"] }
mail-parser = "1.0.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = { version = "0.11.0", default-features = false }
thiserror = "2.0.21"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"
multiple_crate_versions = "allow"
# Contradicts the unreachable_pub lint enabled above, which asks for pub(crate) where this asks for pub.
redundant_pub_crate = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_used = "warn"

[package.metadata.docs.rs]
all-features = true

[profile.mutants]
inherits = "test"
debug = "none"
