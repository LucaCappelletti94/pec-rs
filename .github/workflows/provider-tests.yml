name: Provider tests

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  openpec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: docker build -t pec-openpec provider-tests/openpec
      - run: docker run -d --name pec-openpec -p 127.0.0.1:2525:25 -p 127.0.0.1:2143:143 pec-openpec
      - run: timeout 300 bash -c 'until docker logs pec-openpec 2>&1 | grep -q "PING LDAP 127.0.0.1 Ok"; do sleep 2; done'
      - run: cargo test --manifest-path provider-tests/Cargo.toml --locked --test openpec
        env:
          PEC_OPENPEC_SMTP: 127.0.0.1:2525
          PEC_OPENPEC_IMAP: 127.0.0.1:2143
      - if: failure()
        run: docker logs pec-openpec
